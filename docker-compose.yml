services:
  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_DB: paymentgateway
      POSTGRES_USER: payment
      POSTGRES_PASSWORD: payment
    ports:
      - "5432:5432"
    volumes:
      - postgres-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U payment -d paymentgateway"]
      interval: 5s
      timeout: 5s
      retries: 10

  redis:
    image: redis:7-alpine
    ports:
      - "6379:6379"
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 10

  app:
    build:
      context: ./paymentgateway
    ports:
      - "8080:8080"
    environment:
      DB_URL: jdbc:postgresql://postgres:5432/paymentgateway
      DB_USERNAME: payment
      DB_PASSWORD: payment
      JPA_DDL_AUTO: update
      REDIS_HOST: redis
      REDIS_PORT: 6379
      JWT_SECRET: local-development-only-change-this-secret-32-chars
      ADMIN_EMAIL: admin@example.com
      ADMIN_PASSWORD: local-admin-password-change-me
      RAZORPAY_KEY_ID: local
      RAZORPAY_KEY_SECRET: local
      RAZORPAY_WEBHOOK_SECRET: local
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy

volumes:
  postgres-data:
