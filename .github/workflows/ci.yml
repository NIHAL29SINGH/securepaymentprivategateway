name: Build and test

on:
  push:
    branches: ["**"]
  pull_request:

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: paymentgateway
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "21"
          cache: maven
      - name: Validate Maven project
        run: bash mvnw -B validate
      - name: Run tests
        run: bash mvnw -B test
      - name: Build artifact
        run: bash mvnw -B package -DskipTests
